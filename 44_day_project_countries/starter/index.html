<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 44: Country Explorer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui; background: #f5f5f5; min-height: 100vh; padding: 2rem; }
    .app { max-width: 1000px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 2rem; }
    h1 { font-size: 2rem; color: #333; }
    .search-bar { display: flex; gap: 1rem; justify-content: center; margin-bottom: 2rem; }
    .search-bar input { padding: 1rem 1.5rem; border: 1px solid #ddd; border-radius: 50px; font-size: 1.1rem; width: 100%; max-width: 500px; }
    .search-bar input:focus { outline: none; border-color: #333; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat { background: white; padding: 1.5rem; border-radius: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .stat-value { font-size: 2rem; font-weight: 700; color: #333; }
    .stat-label { color: #888; font-size: 0.9rem; margin-top: 0.25rem; }
    .tabs { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .tab { padding: 0.5rem 1.5rem; border: 1px solid #ddd; border-radius: 8px; background: white; cursor: pointer; }
    .tab.active { background: #333; color: white; border-color: #333; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    .card { background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .card-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 1rem; }
    .card h3 { font-size: 1.15rem; }
    .region { font-size: 0.75rem; padding: 0.2rem 0.6rem; background: #eef; color: #446; border-radius: 999px; }
    .info { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; font-size: 0.9rem; }
    .info dt { color: #888; }
    .info dd { font-weight: 500; }
    .languages { margin-top: 1rem; }
    .languages h4 { font-size: 0.85rem; color: #888; margin-bottom: 0.5rem; }
    .lang-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .lang-tag { font-size: 0.75rem; padding: 0.2rem 0.6rem; background: #eee; border-radius: 999px; }
  </style>
</head>
<body>
  <div class="app">
    <header><h1>🌍 Country Explorer</h1></header>
    
    <div class="search-bar">
      <label for="search" style="position: absolute; width: 1px; height: 1px; overflow: hidden;">Search countries</label>
      <input type="text" id="search" placeholder="Search by name, capital, or language...">
    </div>
    
    <div class="stats">
      <div class="stat"><div class="stat-value" id="totalCountries">0</div><div class="stat-label">Countries</div></div>
      <div class="stat"><div class="stat-value" id="totalPopulation">0</div><div class="stat-label">Total Population</div></div>
      <div class="stat"><div class="stat-value" id="totalLanguages">0</div><div class="stat-label">Languages</div></div>
      <div class="stat"><div class="stat-value" id="totalArea">0</div><div class="stat-label">Total Area (km²)</div></div>
    </div>
    
    <div class="tabs">
      <button class="tab active" data-region="all">All Regions</button>
      <button class="tab" data-region="Africa">Africa</button>
      <button class="tab" data-region="Americas">Americas</button>
      <button class="tab" data-region="Asia">Asia</button>
      <button class="tab" data-region="Europe">Europe</button>
      <button class="tab" data-region="Oceania">Oceania</button>
    </div>
    
    <div class="grid" id="countryGrid"></div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
