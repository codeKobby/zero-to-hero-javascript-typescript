<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 42: Discussion Forum</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui; background: #f5f5f5; min-height: 100vh; padding: 2rem; }
    .app { max-width: 700px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 2rem; }
    h1 { font-size: 2rem; color: #333; }
    .new-post { background: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 2rem; }
    .new-post h2 { margin-bottom: 1rem; font-size: 1.2rem; }
    .form-row { display: flex; gap: 1rem; margin-bottom: 1rem; }
    .form-row > div { flex: 1; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
    input, textarea { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; font-family: inherit; }
    textarea { min-height: 100px; resize: vertical; }
    .btn { padding: 0.75rem 1.5rem; background: #333; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
    .btn:hover { background: #555; }
    .posts { display: flex; flex-direction: column; gap: 1.5rem; }
    .post { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow: hidden; }
    .post-header { padding: 1.5rem; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
    .post-author { font-weight: 600; color: #333; }
    .post-time { color: #888; font-size: 0.85rem; }
    .post-content { padding: 1.5rem; }
    .post-actions { display: flex; gap: 1rem; padding: 1rem 1.5rem; border-top: 1px solid #eee; }
    .action-btn { display: flex; align-items: center; gap: 0.5rem; background: none; border: none; cursor: pointer; color: #555; font-size: 0.9rem; padding: 0.5rem; }
    .action-btn.liked { color: #e00; }
    .comments { border-top: 1px solid #eee; }
    .comment { padding: 1rem 1.5rem; border-bottom: 1px solid #f0f0f0; }
    .comment:last-child { border-bottom: none; }
    .comment-header { display: flex; gap: 0.75rem; margin-bottom: 0.5rem; }
    .comment-author { font-weight: 600; font-size: 0.9rem; }
    .comment-time { color: #888; font-size: 0.8rem; }
    .comment-text { color: #444; font-size: 0.95rem; }
    .add-comment { padding: 1rem 1.5rem; display: flex; gap: 0.5rem; }
    .add-comment input { flex: 1; padding: 0.75rem; border: 1px solid #ddd; border-radius: 8px; }
    .add-comment button { padding: 0.75rem 1rem; background: #333; color: white; border: none; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="app">
    <header><h1>💬 Discussion Forum</h1></header>
    
    <div class="new-post">
      <h2>New Post</h2>
      <form id="postForm">
        <div class="form-row">
          <div>
            <label for="authorName">Your Name</label>
            <input type="text" id="authorName" name="authorName" required placeholder="Alex">
          </div>
          <div>
            <label for="postTitle">Title</label>
            <input type="text" id="postTitle" name="title" required placeholder="Question about TypeScript generics...">
          </div>
        </div>
        <div>
          <label for="postContent">Content</label>
          <textarea id="postContent" name="content" required placeholder="Write your post here..."></textarea>
        </div>
        <button type="submit" class="btn">Post</button>
      </form>
    </div>
    
    <div class="posts" id="postsContainer"></div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
