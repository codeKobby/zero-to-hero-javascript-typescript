<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 41: Recipe Book</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui; background: #fafafa; min-height: 100vh; padding: 2rem; }
    .app { max-width: 800px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 2rem; }
    h1 { font-size: 2rem; color: #333; }
    .tabs { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 1.5rem; }
    .tab { padding: 0.5rem 1.5rem; border: 1px solid #ddd; border-radius: 8px; background: white; cursor: pointer; }
    .tab.active { background: #333; color: white; border-color: #333; }
    .add-btn { display: block; margin: 0 auto 2rem; padding: 0.75rem 2rem; background: #333; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    .card { background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .card-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 0.75rem; }
    .category { font-size: 0.75rem; padding: 0.2rem 0.6rem; background: #eee; border-radius: 999px; text-transform: capitalize; }
    .card.favorite .category { background: #fff3cd; color: #856404; }
    h3 { font-size: 1.1rem; margin-bottom: 0.5rem; }
    .meta { display: flex; gap: 1rem; color: #888; font-size: 0.85rem; margin-bottom: 1rem; }
    .ingredients { font-size: 0.9rem; color: #555; }
    .ingredients li { margin: 0.25rem 0; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .modal.open { opacity: 1; pointer-events: auto; }
    .modal-content { background: white; padding: 2rem; border-radius: 16px; width: 90%; max-width: 500px; max-height: 90vh; overflow: auto; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
    input, textarea, select { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; font-family: inherit; }
    .modal-actions { display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem; }
    .btn { padding: 0.75rem 1.5rem; border-radius: 8px; font-size: 1rem; cursor: pointer; }
    .btn-primary { background: #333; color: white; border: none; }
    .btn-secondary { background: white; color: #333; border: 1px solid #ddd; }
  </style>
</head>
<body>
  <div class="app">
    <header><h1>📖 Recipe Book</h1></header>
    <div class="tabs">
      <button class="tab active" data-filter="all">All</button>
      <button class="tab" data-filter="breakfast">Breakfast</button>
      <button class="tab" data-filter="lunch">Lunch</button>
      <button class="tab" data-filter="dinner">Dinner</button>
      <button class="tab" data-filter="dessert">Dessert</button>
    </div>
    <button class="add-btn" id="addRecipeBtn">+ Add Recipe</button>
    <div class="grid" id="recipeGrid"></div>
  </div>

  <div class="modal" id="recipeModal">
    <div class="modal-content">
      <h2 id="modalTitle">Add Recipe</h2>
      <form id="recipeForm">
        <input type="hidden" name="id">
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" required placeholder="Chocolate Chip Cookies">
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" name="description" rows="3" placeholder="Soft and chewy cookies..."></textarea>
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <select name="category" id="category" required>
            <option value="breakfast">Breakfast</option>
            <option value="lunch">Lunch</option>
            <option value="dinner">Dinner</option>
            <option value="dessert">Dessert</option>
          </select>
        </div>
        <div class="form-group">
          <label for="prepTime">Prep Time (minutes)</label>
          <input type="number" id="prepTime" name="prepTime" min="1" value="30">
        </div>
        <div class="form-group">
          <label for="ingredients">Ingredients (one per line)</label>
          <textarea id="ingredients" name="ingredients" rows="5" required placeholder="2 cups flour&#10;1 cup sugar&#10;1/2 cup butter"></textarea>
        </div>
        <div class="form-group">
          <label for="steps">Steps (one per line)</label>
          <textarea id="steps" name="steps" rows="5" required placeholder="Preheat oven to 350°F&#10;Mix dry ingredients..."></textarea>
        </div>
        <label style="display: flex; align-items: center; gap: 0.5rem;">
          <input type="checkbox" name="isFavorite" id="isFavorite"> Favorite
        </label>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
