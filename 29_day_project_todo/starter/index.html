<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 29: Todo App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui; background: #f5f5f5; min-height: 100vh; padding: 2rem; }
    .app { max-width: 500px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; }
    header { background: #333; color: white; padding: 1.5rem; text-align: center; }
    h1 { font-size: 1.5rem; font-weight: 600; }
    form { display: flex; padding: 1rem; border-bottom: 1px solid #eee; gap: 0.5rem; }
    input { flex: 1; padding: 0.75rem 1rem; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
    input:focus { outline: none; border-color: #333; }
    button[type="submit"] { padding: 0.75rem 1.5rem; background: #333; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
    button[type="submit"]:hover { background: #555; }
    .filters { display: flex; padding: 1rem; gap: 0.5rem; border-bottom: 1px solid #eee; justify-content: center; }
    .filters button { padding: 0.5rem 1rem; border: 1px solid #ddd; border-radius: 6px; background: white; cursor: pointer; }
    .filters button.active { background: #333; color: white; border-color: #333; }
    ul { list-style: none; }
    li { display: flex; align-items: center; gap: 0.75rem; padding: 1rem; border-bottom: 1px solid #eee; }
    li:last-child { border-bottom: none; }
    li.completed span { text-decoration: line-through; color: #999; }
    li.completed label { opacity: 0.5; }
    label { display: flex; align-items: center; gap: 0.75rem; cursor: pointer; flex: 1; }
    input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; }
    .delete-btn { padding: 0.4rem 0.75rem; background: #fee; color: #c00; border: 1px solid #fcc; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
    .delete-btn:hover { background: #fdd; }
    .count { padding: 1rem; text-align: center; color: #888; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="app">
    <header><h1>Todos</h1></header>
    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="What needs to be done?" autofocus required>
      <button type="submit">Add</button>
    </form>
    <div class="filters">
      <button data-filter="all" class="active">All</button>
      <button data-filter="active">Active</button>
      <button data-filter="completed">Completed</button>
    </div>
    <ul id="todo-list"></ul>
    <div class="count" id="todo-count">0 items left</div>
  </div>
  <script src="./js/main.js"></script>
</body>
</html>
